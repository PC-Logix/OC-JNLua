name: Build native libraries

on:
  workflow_call:
    inputs:
      native_version:
        description: Version for the packaged native JAR
        required: false
        type: string
        default: 20260908.0
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/build-natives.yml'
      - '.gitmodules'
  push:
    branches: [master, 'dev/**']
    tags: ['oc-jnlua-natives-*']
    paths:
      - 'native/**'
      - '.github/workflows/build-natives.yml'
      - '.gitmodules'
  workflow_dispatch:
    inputs:
      native_version:
        description: Version for the packaged native JAR
        required: true
        default: 20260908.0
      publish_release:
        description: Publish the packaged JAR and checksum as a GitHub Release
        required: true
        type: boolean
        default: false
      release_tag:
        description: GitHub Release tag (required when publishing)
        required: false

permissions:
  contents: write

concurrency:
  group: native-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x86_64, linux-i686, linux-aarch64, linux-armhf]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes gcc-multilib meson ninja-build
      - name: Build
        run: |
          chmod +x native/build-target.sh native/cross/bin/*
          export PATH="$GITHUB_WORKSPACE/native/cross/bin:$PATH"
          set +e
          OUTPUT_DIR="native/build-output/${{ matrix.target }}" ./native/build-target.sh "native/cross/${{ matrix.target }}.ini" 2>&1 | tee native/build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error title=Native build log tail (base64)::$(tail -n 40 native/build.log | base64 --wrap=0)"
            while IFS= read -r line; do
              echo "::error title=Native build output::$line"
            done < <(tail -n 80 native/build.log)
            exit "$status"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: native/build-output/${{ matrix.target }}/*
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.target }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-x86_64, darwin-aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install build tools
        run: brew install meson ninja
      - name: Build
        run: |
          chmod +x native/build-target.sh native/cross/bin/*
          export PATH="$GITHUB_WORKSPACE/native/cross/bin:$PATH"
          OUTPUT_DIR="native/build-output/${{ matrix.target }}" ./native/build-target.sh "native/cross/${{ matrix.target }}.ini"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: native/build-output/${{ matrix.target }}/*
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.target }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        target: [windows-x86_64-mingw-w64, windows-i686-mingw-w64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-i686-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
      - name: Build
        shell: msys2 {0}
        run: |
          export PATH="/mingw32/bin:$PATH"
          export JAVA_HOME="$(cygpath "$JAVA_HOME")"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          javac -version
          chmod +x native/build-target.sh
          set +e
          OUTPUT_DIR="native/build-output/${{ matrix.target }}" ./native/build-target.sh "native/cross/${{ matrix.target }}.ini" 2>&1 | tee native/build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error title=Native build log tail (base64)::$(tail -n 40 native/build.log | base64 --wrap=0)"
            while IFS= read -r line; do
              echo "::error title=Native build output::$line"
            done < <(tail -n 80 native/build.log)
            exit "$status"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: native/build-output/${{ matrix.target }}/*
          if-no-files-found: error

  freebsd:
    name: FreeBSD x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build inside FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14'
          prepare: pkg install -y bash openjdk21 meson ninja
          run: |
            export JAVA_HOME=/usr/local/openjdk21
            export PATH="$JAVA_HOME/bin:$PATH"
            chmod +x native/build-target.sh
            OUTPUT_DIR=native/build-output/freebsd-x86_64 ./native/build-target.sh
      - uses: actions/upload-artifact@v4
        with:
          name: native-freebsd-x86_64
          path: native/build-output/freebsd-x86_64/*
          if-no-files-found: error

  package:
    name: Package native JAR
    needs: [linux, macos, windows, freebsd]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native/build-all-out
          merge-multiple: true
      - name: Verify target set
        run: |
          test "$(find native/build-all-out -maxdepth 1 -type f | wc -l)" -eq 27
          find native/build-all-out -maxdepth 1 -type f -printf '%f\n' | sort
      - name: Package
        run: ./gradlew nativesJar -PnativeVersion="${{ inputs.native_version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('0.0.0-dev.{0}', github.run_number) }}"
      - name: Write checksums
        run: sha256sum build/libs/OC-JNLua-Natives-*.jar > build/libs/OC-JNLua-Natives-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OC-JNLua-Natives
          path: build/libs/OC-JNLua-Natives-*
          if-no-files-found: error

  release:
    name: Publish native release
    needs: package
    if: ${{ startsWith(github.ref, 'refs/tags/oc-jnlua-natives-') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Validate release inputs
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: test -n "$RELEASE_TAG"
      - uses: actions/download-artifact@v4
        with:
          name: OC-JNLua-Natives
          path: release
      - name: Publish checksummed native JAR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          mv release/OC-JNLua-Natives-*.jar release/OC-JNLua-Natives.jar
          (cd release && sha256sum OC-JNLua-Natives.jar > OC-JNLua-Natives-SHA256SUMS.txt)
          release_json="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "{\"tag_name\":\"$RELEASE_TAG\",\"name\":\"OC-JNLua natives $RELEASE_TAG\",\"generate_release_notes\":true}" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases")"
          upload_url="$(printf '%s' "$release_json" | jq -r '.upload_url' | sed 's/{?name,label}//')"
          test -n "$upload_url" && test "$upload_url" != null
          for asset in release/OC-JNLua-Natives.jar release/OC-JNLua-Natives-SHA256SUMS.txt; do
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header 'Content-Type: application/octet-stream' \
              --data-binary "@$asset" \
              "$upload_url?name=$(basename "$asset")" >/dev/null
          done
